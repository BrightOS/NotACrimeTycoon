<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120f20">
  <meta name="description" content="Неоновый экономический тайкун. Собирайте выручку и развивайте бизнес на побережье.">
  <title>Neon Coast — тайкун на побережье</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="masthead" href="./" aria-label="Neon Coast — главная">
        <span class="masthead-mark" aria-hidden="true"></span>
        <span>NEON<span class="masthead-accent"> COAST</span></span>
      </a>
      <span class="save-status" id="save-status">Автосохранение</span>
    </div>
  </header>

  <main class="shell game">
    <section class="hero" aria-labelledby="game-title">
      <div class="hero-copy">
        <p class="hero-kicker"><span></span>Тайкун на побережье</p>
        <h1 id="game-title">Neon <em>Coast</em></h1>
        <p class="hero-description">Собирайте выручку, нанимайте управляющих и развивайте бизнес на ночном побережье.</p>
      </div>
    </section>

    <section class="finance" aria-label="Финансы">
      <dl class="finance-stats">
        <div class="stat stat-cash">
          <dt><span class="stat-icon" aria-hidden="true">$</span>Касса</dt>
          <dd id="cash">$50</dd>
        </div>
        <div class="stat stat-income">
          <dt><span class="stat-icon" aria-hidden="true">↗</span>Доход в секунду</dt>
          <dd id="income">$1/с</dd>
        </div>
        <div class="stat stat-record">
          <dt><span class="stat-icon" aria-hidden="true">✦</span>Личный рекорд</dt>
          <dd id="record">$0</dd>
        </div>
      </dl>
      <div class="finance-action">
        <button class="collect" id="collect" type="button">
          <span class="collect-icon" aria-hidden="true">+</span>
          <span>Собрать выручку</span>
          <span class="collect-amount" id="collect-amount">+$5</span>
        </button>
      </div>
    </section>

    <section class="portfolio" aria-labelledby="portfolio-title">
      <header class="section-header">
        <h2 id="portfolio-title">Бизнесы</h2>
        <div class="generation">
          <div class="generation-heading">
            <span id="generation">Поколение 1 из 6</span>
            <span id="generation-detail"></span>
          </div>
          <progress id="generation-progress" value="0" max="100" aria-labelledby="generation"></progress>
        </div>
      </header>

      <div class="business-grid" id="businesses"></div>
      <noscript><p class="no-script">Включите JavaScript, чтобы запустить игру.</p></noscript>
    </section>
  </main>

  <aside class="offline-toast" id="offline-toast" role="status" hidden>
    <span class="offline-icon" aria-hidden="true">↗</span>
    <div>
      <strong id="offline-title">Выручка за время отсутствия</strong>
      <p id="offline-text"></p>
    </div>
    <button id="offline-close" class="offline-close" type="button" aria-label="Закрыть уведомление">×</button>
  </aside>
  <div id="game-status" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
